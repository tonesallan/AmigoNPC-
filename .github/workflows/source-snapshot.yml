name: AmigoNPC Source Snapshot

on:
  push:
    branches:
      - recovery/amigonpc-2.0.1-source

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: amigonpc-source-snapshot
          path: |
            .
            !.git
            !build
            !.gradle
            !reference
          include-hidden-files: true
          retention-days: 1
