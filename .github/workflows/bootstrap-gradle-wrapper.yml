name: Bootstrap Gradle Wrapper

on:
  push:
    branches:
      - rebuild/amigonpc-2.0
    paths:
      - .github/workflows/bootstrap-gradle-wrapper.yml

permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rebuild branch
        uses: actions/checkout@v4
        with:
          ref: rebuild/amigonpc-2.0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'

      - name: Generate wrapper
        run: gradle wrapper --gradle-version 9.3.0 --distribution-type bin

      - name: Commit wrapper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo "Gradle Wrapper already up to date."
            exit 0
          fi
          git commit -m "build(rebuild): add Gradle 9.3 wrapper"
          git push origin HEAD:rebuild/amigonpc-2.0
