plugins {
    id 'java'
}

group = 'br.tones'
version = '2.0.1'

repositories {
    mavenCentral()
}


// Exact language bundle recovered from the preserved AmigoNPC 2.0.1 JAR.
// Stored as Base64 text parts so the original ZIP bytes can be reproduced
// without rewriting any translated .properties content.
def recoveredLangParts = (1..8).collect {
    file(String.format("recovery/resources/langzip.part%02d", it))
}
def recoveredLangZipOutput = layout.buildDirectory.file("recovery/AmigoNPC_LANG_ORIGINAL_2.0.1.zip")
def recoveredLangZipSha256 = "C0203CF1B5C5413D4889B209D71A74B3DF0168E645D8EAEDB2B49C3E7D4B64CD"

tasks.register("prepareRecoveredLangZip") {
    inputs.files(recoveredLangParts)
    outputs.file(recoveredLangZipOutput)

    doLast {
        def missing = recoveredLangParts.findAll { !it.exists() }
        if (!missing.isEmpty()) {
            throw new GradleException("Missing recovered language resource parts: " + missing.join(", "))
        }

        def encoded = recoveredLangParts.collect { it.getText("UTF-8").trim() }.join("")
        def bytes = java.util.Base64.getDecoder().decode(encoded)

        def digest = java.security.MessageDigest.getInstance("SHA-256").digest(bytes)
        def actualSha256 = digest.collect { String.format("%02X", it & 0xff) }.join()

        if (actualSha256 != recoveredLangZipSha256) {
            throw new GradleException(
                "Recovered language bundle checksum mismatch. Expected " +
                recoveredLangZipSha256 + ", got " + actualSha256
            )
        }

        def outZip = recoveredLangZipOutput.get().asFile
        outZip.parentFile.mkdirs()
        outZip.bytes = bytes
    }
}

tasks.named("processResources") {
    dependsOn("prepareRecoveredLangZip")

    from({
        zipTree(recoveredLangZipOutput.get().asFile)
    }) {
        eachFile { details ->
            details.path = details.path.replace('\\', '/')
        }
        includeEmptyDirs = false
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    // Permite compilar em outras máquinas/ambientes sem precisar editar este arquivo:
    // - Se a env HYTALE_SERVER_JAR existir, usamos ela.
    // - Caso contrário, cai no caminho padrão do Windows (seu setup atual).
    def serverJarPath = System.getenv("HYTALE_SERVER_JAR") ?: "C:/Users/tones/AppData/Roaming/Hytale/install/release/package/game/latest/Server/HytaleServer.jar"
    compileOnly files(serverJarPath)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveBaseName.set("AmigoNPC")
    archiveVersion.set(version.toString())
    manifest {
        attributes(
            "Implementation-Title": "AmigoNPC",
            "Implementation-Version": version.toString()
        )
    }
}


/*
 * CurseForge 2.0.1 exact baseline.
 *
 * This task does NOT rebuild the mod from recovered sources. It first establishes
 * an immutable byte-for-byte runtime baseline from the JAR supplied by the author.
 * Recovered source parity is validated against this artifact before new features
 * are introduced.
 */
def curseForgeBaselineJar = file("reference/AmigoNPC-2.0.1-CurseForge.jar")
def curseForgeBaselineSha256 = "31B3515FD5897F2D81818030EC9692B485B0850DEE0E452B1804D5630328ED17"
def curseForgeReplicaOutput = layout.buildDirectory.file("libs/AmigoNPC-2.0.1-curseforge-replica.jar")

def sha256File = { File input ->
    def digest = java.security.MessageDigest.getInstance("SHA-256")
    input.withInputStream { stream ->
        byte[] buffer = new byte[64 * 1024]
        int read
        while ((read = stream.read(buffer)) > 0) {
            digest.update(buffer, 0, read)
        }
    }
    digest.digest().collect { String.format("%02X", it & 0xff) }.join()
}

tasks.register("verifyCurseForgeBaseline") {
    doLast {
        if (!curseForgeBaselineJar.exists()) {
            throw new GradleException(
                "Missing CurseForge baseline JAR: " + curseForgeBaselineJar +
                ". Place the supplied AmigoNPC-2.0.1.jar there before running this task."
            )
        }

        def actual = sha256File(curseForgeBaselineJar)
        if (actual != curseForgeBaselineSha256) {
            throw new GradleException(
                "Wrong CurseForge baseline JAR. Expected SHA-256 " +
                curseForgeBaselineSha256 + ", got " + actual
            )
        }

        println "CurseForge baseline verified: " + actual
    }
}

tasks.register("replicaCurseForge") {
    dependsOn("verifyCurseForgeBaseline")

    doLast {
        def output = curseForgeReplicaOutput.get().asFile
        output.parentFile.mkdirs()

        java.nio.file.Files.copy(
            curseForgeBaselineJar.toPath(),
            output.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )

        def actual = sha256File(output)
        if (actual != curseForgeBaselineSha256) {
            throw new GradleException(
                "Replica checksum mismatch. Expected " +
                curseForgeBaselineSha256 + ", got " + actual
            )
        }

        println "Exact CurseForge replica: " + output
        println "SHA-256: " + actual
    }
}


sourceSets {
    curseForgePermissionCompat {
        java.srcDir "compat/curseforge-permissions/src/main/java"
        resources.srcDir "compat/curseforge-permissions/src/main/resources"
    }
}

dependencies {
    def compatServerJarPath = System.getenv("HYTALE_SERVER_JAR") ?: "C:/Users/tones/AppData/Roaming/Hytale/install/release/package/game/latest/Server/HytaleServer.jar"
    curseForgePermissionCompatCompileOnly files(compatServerJarPath)
}

tasks.register("curseForgePermissionCompatJar", Jar) {
    dependsOn("curseForgePermissionCompatClasses")
    from(sourceSets.curseForgePermissionCompat.output)
    archiveBaseName.set("AmigoNPC-PermissionCompat")
    archiveVersion.set("1.0.1")
    destinationDirectory.set(layout.buildDirectory.dir("libs"))
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
